services:
  - type: web
    name: algoguardian-stk-api
    runtime: python
    plan: starter
    rootDir: STK-SERVICE
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DARAJA_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_TILL_NUMBER
        sync: false
      - key: STK_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STK_CALLBACK_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
